name: upstream-freshness-monitor

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pin vs upstream latest (structured delta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'EOF'
          import json, subprocess, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          from ov_amd.freshness import analyze, load_catalog, fetch_compare

          meta = json.loads(Path("upstream/openvino-notebooks.json").read_text())
          pin = meta["commit"]
          r = subprocess.run(
              ["curl", "-sSfL", "https://api.github.com/repos/openvinotoolkit/openvino_notebooks/commits/latest"],
              capture_output=True, text=True, timeout=120, check=True)
          head = json.loads(r.stdout)["sha"]
          print(f"pin={pin}")
          print(f"head={head}")
          Path("/tmp/pin_head").write_text(f"{pin} {head}")

          if pin == head:
              report = analyze(pin, head, {"total_commits": 0, "files": []}, load_catalog(Path("catalog/notebooks.yaml")))
          else:
              compare = fetch_compare(pin, head)
              report = analyze(pin, head, compare, load_catalog(Path("catalog/notebooks.yaml")))
          Path("/tmp/report.md").write_text(report.markdown())
          print(report.markdown())
          EOF
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          read -r PIN HEAD < /tmp/pin_head
          if [ "$PIN" != "$HEAD" ]; then
            echo "::error::OpenVINO Notebooks upstream advanced ($PIN -> $HEAD); see structured delta in the step summary"
            exit 1
          fi
          echo "CURRENT — pin matches upstream latest"

      - name: Open or update tracking issue (only when advanced)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          read -r PIN HEAD < /tmp/pin_head
          TITLE="upstream advanced: pin ${PIN:0:12} -> ${HEAD:0:12} (revalidation required)"
          # dedup: never file a second open issue for the same head
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title ${HEAD:0:12}" --json number,title --jq ".[] | select(.title | contains(\"${HEAD:0:12}\")) | .number")
          if [ -n "$EXISTING" ]; then
            echo "open issue #$EXISTING already tracks head ${HEAD:0:12} — commenting instead of duplicating"
            gh issue comment "$EXISTING" --repo "$REPO" --body "Scheduled check re-detected the same advanced head (${HEAD:0:12}). See latest workflow summary: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --label "upstream-freshness" \
            --body-file /tmp/report.md
