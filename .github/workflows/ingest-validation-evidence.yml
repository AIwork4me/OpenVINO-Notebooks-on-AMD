name: ingest-validation-evidence

# One-off operational workflow: pulls artifacts from a completed validation
# run (runner-side, where the artifact blob is reachable) and commits the
# evidence + state back to the repository, so campaign results land in-repo
# even when interactive machines cannot reach the artifact CDN.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "actions run id whose artifacts to ingest"
        required: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: [self-hosted, amd64, amd-cpu]
    timeout-minutes: 90
    steps:
      - name: Resilient checkout (github.com with site-mirror fallback)
        run: |
          set -e
          # actions/checkout hangs for hours on runners whose only reliable
          # git route is the site mirror; do it manually with bounded retries
          # across both transports (clone is unauthenticated — repo is public;
          # pushes later use the runner's stored credentials as before).
          REPO="$GITHUB_REPOSITORY"
          rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init -q
          git config user.name "ovamd-ingest"
          git config user.email "runner@users.noreply.github.com"
          ok=""
          for BASE in "https://github.com" "${OV_AMD_GIT_MIRROR:-https://gh-test.anruicloud.com}"; do
            for i in 1 2 3; do
              URL="$BASE/$REPO"
              if git fetch --depth 1 "$URL" main 2>/dev/null; then ok="$URL"; break; fi
              echo "fetch failed via $BASE (attempt $i)"; sleep 10
            done
            [ -n "$ok" ] && break
          done
          [ -z "$ok" ] && { echo "FATAL: could not fetch main via any transport"; exit 1; }
          echo "fetched via $ok"
          git checkout -q FETCH_HEAD
          git branch -q -f main FETCH_HEAD 2>/dev/null || true
          git checkout -q main 2>/dev/null || true
          git log --oneline -1
      - name: Download artifacts (resumable)
        run: |
          set -e
          mkdir -p /tmp/ingest && cd /tmp/ingest
          RUN_ID="${{ github.event.inputs.run_id }}"
          # small artifact via gh; big bundle via signed-blob curl with resume
          # (single-shot 180MB transfers reset on flaky routes; Azure signed
          # URLs honour Range, curl -C - resumes across retries)
          for name in marathon-state cpu-evidence; do
            AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate --jq ".artifacts[] | select(.name==\"$name\") | .id" | head -1)
            [ -z "$AID" ] && { echo "artifact $name not found"; continue; }
            echo "artifact $name id=$AID"
            for i in $(seq 1 12); do
              LOC=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" --include 2>/dev/null | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
              [ -z "$LOC" ] && { echo "no redirect (attempt $i)"; sleep 10; continue; }
              curl -sSL -C - --max-time 900 --retry 3 -o "$name.zip" "$LOC" && break
              echo "transfer interrupted (attempt $i), resuming"
              sleep 10
            done
            ls -la "$name.zip" 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Overlay evidence
        run: |
          cd /tmp/ingest
          for z in *.zip; do
            [ -f "$z" ] || continue
            d="${z%.zip}"; mkdir -p "$d" && python3 -c "import zipfile; zipfile.ZipFile('$z').extractall('$d')"
          done
          if [ -f cpu-evidence/cpu-evidence.tgz ]; then
            tar -xzf cpu-evidence/cpu-evidence.tgz -C "$GITHUB_WORKSPACE"
          fi
          if [ -f marathon-state/marathon-state/marathon-state.json ]; then
            cp marathon-state/marathon-state/marathon-state.json "$GITHUB_WORKSPACE/results/marathon-state.json"
          elif [ -f marathon-state/marathon-state.json ]; then
            cp marathon-state/marathon-state.json "$GITHUB_WORKSPACE/results/marathon-state.json"
          fi
      - name: Regenerate reports
        run: |
          python3 -m ov_amd report || true
      - name: Commit evidence back
        run: |
          git config user.name "ovamd-ingest"
          git config user.email "runner@users.noreply.github.com"
          git add results catalog reports 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: ingest validation evidence from run ${{ github.event.inputs.run_id }}"
          for i in 1 2 3 4 5; do git push && break || { git pull --rebase || true; sleep 10; }; done
