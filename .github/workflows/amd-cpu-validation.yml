name: amd-cpu-validation

# Self-hosted workflow: runs the OpenVINO-on-Ryzen validation on the AMD
# reference machine (Ryzen AI Max+ PRO 395). The runner workspace is a fresh
# checkout; the persistent machine assets (validation venv, pinned upstream
# snapshot, warm uv cache) are linked in. Evidence stays workspace-local and
# is uploaded as artifacts. Status badges must only cite real runs.

on:
  workflow_dispatch:
    inputs:
      priority_max:
        description: "max priority tier to run (0..4)"
        default: "1"

jobs:
  cpu:
    runs-on: [self-hosted, amd64, amd-cpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Link persistent validation assets
        run: |
          REF=/home/amd/Desktop/OpenVINO-Notebooks-on-AMD
          if [ ! -d "$REF" ]; then echo "reference checkout missing"; exit 1; fi
          ln -s "$REF/.venv-cpu" .venv-cpu
          mkdir -p .cache
          ln -s "$REF/.cache/upstream" .cache/upstream
      - name: Doctor
        run: python3 -m ov_amd doctor
      - name: Marathon (CPU, bounded)
        run: python3 scripts/run_marathon.py --cpu-only --priority ${{ github.event.inputs.priority_max || '1' }} --max-runtime 7200
      - name: Report
        run: python3 -m ov_amd report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marathon-state
          path: results/marathon-state.json

# Ryzen AI Max+ 395: CPU and Radeon 8060S share one SoC (RAM/thermal domain);
# CPU and GPU validation must never overlap.
concurrency:
  group: amd-reference-validation
  cancel-in-progress: false
