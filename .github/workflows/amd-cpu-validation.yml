name: amd-cpu-validation

# Self-hosted workflow: runs the OpenVINO-on-AMD CPU validation on a
# self-hosted runner labelled [self-hosted, amd64, amd-cpu]. The runner
# workspace is a fresh checkout; the pinned upstream snapshot is provisioned
# by scripts/fetch_upstream.py when no warm copy is linked in. Evidence stays
# workspace-local and is uploaded as artifacts. Status badges must only cite
# real runs of this workflow.

on:
  workflow_dispatch:
    inputs:
      priority_max:
        description: "max priority tier to run (0..4)"
        default: "1"

jobs:
  cpu:
    runs-on: [self-hosted, amd64, amd-cpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Provision pinned upstream snapshot (pin-bound, runner-agnostic)
        run: |
          set -e
          PIN=$(python3 -c "import json;print(json.load(open('upstream/openvino-notebooks.json'))['commit'])")
          echo "repo pin: $PIN"
          # warm link only when the persistent snapshot is EXACTLY the pinned
          # commit (checked via its manifest) — pin drift invalidates the run
          for REF in "$HOME/Desktop/OpenVINO-Notebooks-on-AMD" "$HOME/OpenVINO-Notebooks-on-AMD"; do
            if [ -f "$REF/upstream/openvino-notebooks.json" ] && [ -d "$REF/.cache/upstream/notebooks" ]; then
              WPIN=$(python3 -c "import json;print(json.load(open('$REF/upstream/openvino-notebooks.json'))['commit'])")
              if [ "$WPIN" = "$PIN" ]; then
                mkdir -p .cache && ln -s "$REF/.cache/upstream" .cache/upstream
                echo "warm snapshot linked from $REF (pin verified)"; break
              else
                echo "warm snapshot at $REF is $WPIN != pin $PIN — not used"
              fi
            fi
          done
          if [ ! -d .cache/upstream ]; then
            python3 scripts/fetch_upstream.py --blobs --commit "$PIN"
          fi
          test -d .cache/upstream/notebooks || { echo "upstream snapshot unavailable"; exit 1; }
      - name: Doctor
        run: python3 -m ov_amd doctor
      - name: Marathon (CPU, bounded)
        run: python3 scripts/run_marathon.py --cpu-only --priority ${{ github.event.inputs.priority_max || '1' }} --max-runtime 7200
      - name: Report
        run: python3 -m ov_amd report
      - name: Bundle evidence (state + v2 evidence files, no model workdirs)
        if: always()
        run: |
          tar -czf cpu-evidence.tgz \
            --exclude='workdir-cpu' --exclude='workdir-gpu' \
            --exclude='*.safetensors' --exclude='*.bin' --exclude='*.pt' --exclude='*.onnx' --exclude='*.zip' \
            results
          ls -la cpu-evidence.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marathon-state
          path: results/marathon-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence
          path: cpu-evidence.tgz

# AMD reference platforms: CPU and GPU validation must never overlap (shared
# memory/thermal domain on SoC platforms; serialized resource domain on
# multi-GPU servers). The shared concurrency group enforces this.
concurrency:
  group: amd-reference-validation
  cancel-in-progress: false
